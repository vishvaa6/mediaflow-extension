<!doctype html><meta charset="utf-8"><title>MediaFlow resolver</title>
<script type="module">
import {resolveMedia} from './media-resolver.js';
import {parsePlaylist,chooseVariant} from './hls-playlist.js';

function fetchResource(url,headers={}) {
  const result=JSON.parse(MediaFlowNative.fetchText(url,JSON.stringify(headers)));
  if(!result.ok)throw Error(result.error || 'Unable to read the video source');
  return result;
}
function fetchText(url,headers={}) { return fetchResource(url,headers).text; }
window.resolveSharedLink=async value=>{
  try {
    const page=new URL(value);
    if(!/^https?:$/.test(page.protocol) || page.username || page.password)throw Error('Enter a valid HTTP or HTTPS video link.');
    const direct=page.pathname.match(/\.(mp4|webm|m3u8)$/i)?.[1]?.toLowerCase();
    const headers={Referer:page.href,Origin:page.origin};
    let media=direct ? {url:page.href,format:direct,quality:'Auto',title:'Video',headers} :
      await resolveMedia(/^(?:www\.|m\.|mobile\.)?(?:x|twitter)\.com$/i.test(page.hostname)?'':fetchText(page.href,{Referer:page.href}),page.href,'best',fetchText,{preferMp4:true});
    media.headers={...headers,...(media.headers || {})};
    if(media.format==='m3u8') {
      let url=media.url,playlist;
      for(let depth=0;depth<6;depth++) {
        const response=fetchResource(url,media.headers);
        playlist=parsePlaylist(response.text,response.url || url);
        if(!playlist.variants)break;
        const chosen=chooseVariant(playlist.variants,media.quality);
        if(chosen.audio && playlist.audioGroups.includes(chosen.audio))throw Error('This stream uses a separate audio track that cannot be combined yet.');
        url=chosen.url;playlist=null;
      }
      if(!playlist?.units)throw Error('Too many nested HLS playlists.');
      if(playlist.outputExtension==='mp4' && playlist.units.some(unit=>unit.discontinuity))throw Error('This fragmented MP4 stream changes timeline and cannot be combined yet.');
      media.units=playlist.units;media.outputExtension=playlist.outputExtension;
    }
    MediaFlowNative.finish(JSON.stringify({ok:true,media}));
  } catch(error) { MediaFlowNative.finish(JSON.stringify({ok:false,error:error.message || String(error)})); }
};
MediaFlowNative.ready();
</script>
